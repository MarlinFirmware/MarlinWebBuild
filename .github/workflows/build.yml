#
# Build firmware for a "build-request" issue, attach it to the "builds" release,
# reply with the download link and close the issue.
#
# Two kinds of request (see tools/parse_request.py):
#   example  an example from MarlinFirmware/Configurations
#   upload   the user's own files, attached to the issue as a zip, migrated to the
#            chosen version if they're from an older Marlin (tools/migrate_user.py)
#
# Issue text and attachments are untrusted: they only reach scripts through env vars
# and files, and are validated (tools/parse_request.py, tools/user_config.py, env list
# check) before use. Uploaded files may only use plain #define-style preprocessor
# lines, because a compiler can be told to read files from the build machine. The
# build job also runs without a token and without credentials on disk.
#
name: Build request

on:
  issues:
    types: [opened]

concurrency:
  group: build-${{ github.event.issue.number }}

env:
  MARLIN_REPO: MarlinFirmware/Marlin
  CONFIGS_REPO: MarlinFirmware/Configurations
  DAILY_LIMIT: 5          # Build requests per user per 24h (repo owner exempt)

jobs:
  prepare:
    if: contains(github.event.issue.labels.*.name, 'build-request')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      ok: ${{ steps.check.outputs.ok }}
      mode: ${{ steps.parse.outputs.mode }}
      version: ${{ steps.parse.outputs.version }}
      release: ${{ steps.check.outputs.release }}
      config: ${{ steps.parse.outputs.config }}
      env: ${{ steps.check.outputs.env }}
      envs: ${{ steps.check.outputs.envs }}
      board: ${{ steps.check.outputs.board }}
      base: ${{ steps.check.outputs.base }}
      migrated: ${{ steps.check.outputs.migrated }}
      changes: ${{ steps.check.outputs.changes }}
      marlin_sha: ${{ steps.check.outputs.marlin_sha }}
      configs_sha: ${{ steps.check.outputs.configs_sha }}
      key: ${{ steps.check.outputs.key }}
      cached: ${{ steps.check.outputs.cached }}
      prebuilt: ${{ steps.check.outputs.prebuilt }}
      prebuilt_url: ${{ steps.check.outputs.prebuilt_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      AUTHOR: ${{ github.event.issue.user.login }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Parse request
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 tools/parse_request.py 2> err.txt || {
            gh issue comment "$ISSUE" --body "Sorry, I couldn't read this request: $(cat err.txt)"
            gh issue close "$ISSUE" --reason "not planned"
            exit 1
          }

      - name: Validate and look up cache
        id: check
        env:
          MODE: ${{ steps.parse.outputs.mode }}
          VERSION: ${{ steps.parse.outputs.version }}
          MARLIN_REF: ${{ steps.parse.outputs.marlin_ref }}
          CONFIGS_REF: ${{ steps.parse.outputs.configs_ref }}
          CONFIG: ${{ steps.parse.outputs.config }}
          UPLOAD: ${{ steps.parse.outputs.upload }}
          REQ_ENV: ${{ steps.parse.outputs.env }}
          OWNER: ${{ github.repository_owner }}
        run: |
          reject() {
            gh issue comment "$ISSUE" --body "$1"
            gh issue close "$ISSUE" --reason "not planned"
            exit 1
          }

          # Rate limit
          if [[ "$AUTHOR" != "$OWNER" ]]; then
            SINCE=$(date -u -d '-1 day' +%Y-%m-%dT%H:%M:%SZ)
            N=$(gh issue list --state all --label build-request --author "$AUTHOR" --search "created:>=$SINCE" --json number --jq length)
            (( N > DAILY_LIMIT )) && reject "Sorry, there's a limit of $DAILY_LIMIT build requests per day. Please try again tomorrow."
          fi

          # parse_request.py checked the version and looked up its Marlin tag or branch
          # and its Configurations ref (see tools/versions.py).
          RELEASE=true; [[ $VERSION == bugfix-* ]] && RELEASE=false
          BASE='' MIGRATED=false CHANGES='' CONFIGS_SHA=''

          if [[ $MODE == upload ]]; then
            # Download, unpack and check the user's zip
            python3 tools/user_config.py fetch "$UPLOAD" _upload > upload.json 2> err.txt \
              || reject "Sorry, I can't use the attached configuration: $(tail -n1 err.txt)"

            # Full history (bare, ~300 MB) lets config-migrate.py find the stock files the user started from
            git clone -q --bare "https://github.com/$MARLIN_REPO" _repo
            MARLIN_SHA=$(git -C _repo rev-parse "$MARLIN_REF^{commit}") || reject "Sorry, Marlin \`$VERSION\` wasn't found."
            python3 tools/migrate_user.py _repo "$MARLIN_SHA" _upload _final "$VERSION" > migrate.json 2> err.txt \
              || reject "Sorry, I can't use the attached configuration: $(tail -n1 err.txt)"
            for f in _Bootscreen.h _Statusscreen.h; do
              if [[ -f "_upload/$f" ]]; then cp "_upload/$f" _final/; fi
            done
            BASE=$(jq -r .base migrate.json)
            MIGRATED=$(jq -r .migrated migrate.json)
            CHANGES=$(jq -r '.counts | to_entries | map("\(.value) \(.key | ascii_downcase | sub(" \\(.*"; ""))") | join(", ")' migrate.json)

            # Build environments for the board in the (migrated) Configuration.h
            mkdir -p _marlin/Marlin/src/pins
            git -C _repo show "$MARLIN_SHA:Marlin/src/pins/pins.h" > _marlin/Marlin/src/pins/pins.h
            ENVS=$(python3 tools/marlin_index.py envs-dir _marlin _final 2>&1) \
              || reject "Sorry, your configuration can't be built with Marlin \`$VERSION\`: $ENVS"
            BOARD=$(sed -nE 's/^[[:space:]]*#define[[:space:]]+MOTHERBOARD[[:space:]]+BOARD_([A-Za-z0-9_]+).*/\1/p' _final/Configuration.h | head -n1)
            [[ -n $ENVS ]] || reject "Sorry, your board \`$BOARD\` has no build environment in Marlin \`$VERSION\`."
            WHAT="your configuration"
            TREE=$(cd _final && sha256sum -- * | sha256sum | cut -c1-40)
          else
            # Fetch just enough of both repos to validate the request
            git clone -q --depth 1 --filter=blob:none --sparse -b "$MARLIN_REF" "https://github.com/$MARLIN_REPO" _marlin \
              || reject "Sorry, Marlin \`$VERSION\` wasn't found."
            git -C _marlin sparse-checkout set Marlin/src/pins
            git clone -q --depth 1 --filter=blob:none --sparse -b "$CONFIGS_REF" "https://github.com/$CONFIGS_REPO" _cfg \
              || reject "Sorry, there are no example configurations for Marlin \`$VERSION\`."
            git -C _cfg sparse-checkout set --no-cone "/config/examples/$CONFIG/*"

            ENVS=$(python3 tools/marlin_index.py envs _marlin _cfg "$CONFIG" 2>&1) \
              || reject "Sorry, \`$CONFIG\` isn't a configuration I can build for Marlin \`$VERSION\`: $ENVS"
            [[ -n $ENVS ]] || reject "Sorry, the board used by \`$CONFIG\` has no build environment in Marlin \`$VERSION\`."
            BOARD=''
            WHAT="\`$CONFIG\`"
            MARLIN_SHA=$(git -C _marlin rev-parse HEAD)
            CONFIGS_SHA=$(git -C _cfg rev-parse HEAD)
            TREE=$(git -C _cfg rev-parse "HEAD:config/examples/$CONFIG")
          fi

          ENV=${REQ_ENV:-$(head -n1 <<<"$ENVS")}
          grep -qx -- "$ENV" <<<"$ENVS" \
            || reject "Sorry, \`$ENV\` isn't a valid environment for $WHAT. Valid choices: $(echo $ENVS | sed 's/[^ ]\+/`&`/g')"

          KEY=$(printf '%s\n' "$MARLIN_SHA" "$TREE" "$ENV" | sha256sum | cut -c1-16)

          CACHED=false
          gh release view builds --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "build-$KEY.zip" && CACHED=true

          # A stock example at a release may already be built in MarlinFirmware/MarlinBuilds:
          # use that firmware instead of building it again (tools/prebuilt.py checks its SHA-256).
          PREBUILT=false PREBUILT_URL=''
          if [[ $CACHED != true && $MODE == example && $RELEASE == true ]]; then
            if python3 tools/prebuilt.py "$VERSION" "$CONFIG" "$ENV" _prebuilt > prebuilt.json 2> err.txt; then
              PREBUILT=true
              PREBUILT_URL=$(jq -r .url prebuilt.json)
            else
              echo "Building instead: $(cat err.txt)"
            fi
          fi

          {
            echo "ok=true"
            echo "release=$RELEASE"
            echo "env=$ENV"
            echo "envs=$(echo $ENVS)"
            echo "board=$BOARD"
            echo "base=$BASE"
            echo "migrated=$MIGRATED"
            echo "changes=$CHANGES"
            echo "marlin_sha=$MARLIN_SHA"
            echo "configs_sha=$CONFIGS_SHA"
            echo "key=$KEY"
            echo "cached=$CACHED"
            echo "prebuilt=$PREBUILT"
            echo "prebuilt_url=$PREBUILT_URL"
          } >> "$GITHUB_OUTPUT"

          if [[ $CACHED != true && $PREBUILT != true ]]; then
            MSG="Building $WHAT for \`$ENV\` from Marlin \`$VERSION\` (\`${MARLIN_SHA:0:10}\`)."
            if [[ $MODE == upload ]]; then
              if [[ $MIGRATED == true ]]; then
                MSG+=" Your files are based on Marlin \`$BASE\`, so I migrated them to \`$VERSION\` ($CHANGES). The migrated files and a report come with the firmware."
              else
                MSG+=" Your files match the stock files of \`$VERSION\`, so they're used unchanged."
              fi
            fi
            gh issue comment "$ISSUE" --body "$MSG This usually takes a few minutes. [Watch the build]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          fi

      - name: Package prebuilt firmware
        if: steps.check.outputs.prebuilt == 'true'
        env:
          VERSION: ${{ steps.parse.outputs.version }}
          CONFIG: ${{ steps.parse.outputs.config }}
          PIO_ENV: ${{ steps.check.outputs.env }}
          KEY: ${{ steps.check.outputs.key }}
          MARLIN_SHA: ${{ steps.check.outputs.marlin_sha }}
          CONFIGS_SHA: ${{ steps.check.outputs.configs_sha }}
          PREBUILT_URL: ${{ steps.check.outputs.prebuilt_url }}
        run: |
          mkdir -p out/config
          cp _prebuilt/* out/
          for f in Configuration.h Configuration_adv.h _Bootscreen.h _Statusscreen.h; do
            if [[ -f "_cfg/config/examples/$CONFIG/$f" ]]; then cp "_cfg/config/examples/$CONFIG/$f" out/config/; fi
          done
          cat > out/BUILD_INFO.txt <<EOF
          Marlin version: $VERSION
          Configuration: $CONFIG
          Configurations: https://github.com/$CONFIGS_REPO/tree/$CONFIGS_SHA/config/examples/${CONFIG// /%20}
          Environment:   $PIO_ENV
          Marlin:        https://github.com/$MARLIN_REPO/commit/$MARLIN_SHA
          Firmware:      Published build from MarlinFirmware/MarlinBuilds, not rebuilt:
                         $PREBUILT_URL
          Packaged:      $(date -u +'%Y-%m-%d %H:%M UTC')

          Copy the firmware file to the printer's SD card without renaming it
          (some boards only accept a specific file name). The config/ folder
          holds the example configuration files this firmware was built from.

          Marlin $VERSION is a release and no longer gets fixes. Before reporting
          a bug, please check whether it still happens with bugfix-2.1.x.
          EOF
          (cd out && zip -r "../build-$KEY.zip" .)

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.prebuilt == 'true'
        with:
          name: firmware
          path: build-${{ steps.check.outputs.key }}.zip
          retention-days: 1

      - name: Keep the uploaded configuration for the build
        if: steps.parse.outputs.mode == 'upload' && steps.check.outputs.cached != 'true'
        run: |
          mkdir -p userconfig/original
          cp -R _final userconfig/final
          cp _upload/* userconfig/original/

      - uses: actions/upload-artifact@v7
        if: steps.parse.outputs.mode == 'upload' && steps.check.outputs.cached != 'true'
        with:
          name: userconfig
          path: userconfig
          retention-days: 1

  build:
    needs: prepare
    if: needs.prepare.outputs.ok == 'true' && needs.prepare.outputs.cached != 'true' && needs.prepare.outputs.prebuilt != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MODE: ${{ needs.prepare.outputs.mode }}
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE: ${{ needs.prepare.outputs.release }}
      CONFIG: ${{ needs.prepare.outputs.config }}
      PIO_ENV: ${{ needs.prepare.outputs.env }}
      BASE: ${{ needs.prepare.outputs.base }}
      MIGRATED: ${{ needs.prepare.outputs.migrated }}
      KEY: ${{ needs.prepare.outputs.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.MARLIN_REPO }}
          ref: ${{ needs.prepare.outputs.marlin_sha }}
          path: marlin
          persist-credentials: false

      - uses: actions/checkout@v7
        if: needs.prepare.outputs.mode == 'example'
        with:
          repository: ${{ env.CONFIGS_REPO }}
          ref: ${{ needs.prepare.outputs.configs_sha }}
          path: cfg
          sparse-checkout: config/examples/${{ needs.prepare.outputs.config }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        if: needs.prepare.outputs.mode == 'upload'
        with:
          name: userconfig
          path: userconfig

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ needs.prepare.outputs.env }}-${{ hashFiles('marlin/platformio.ini', 'marlin/ini/*.ini') }}
          restore-keys: |
            pio-${{ needs.prepare.outputs.env }}-
            pio-

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Apply configuration
        run: |
          mkdir -p out/config
          if [[ $MODE == upload ]]; then
            SRC=userconfig/final
            cp -R userconfig/original out/original
            if [[ -f $SRC/report.txt ]]; then mv "$SRC/report.txt" out/MIGRATION_REPORT.txt; fi
          else
            SRC="cfg/config/examples/$CONFIG"
          fi
          for f in Configuration.h Configuration_adv.h _Bootscreen.h _Statusscreen.h; do
            if [[ -f "$SRC/$f" ]]; then
              cp "$SRC/$f" marlin/Marlin/
              cp "$SRC/$f" out/config/
            fi
          done

      - name: Package configuration
        if: needs.prepare.outputs.mode == 'upload'
        run: (cd out && zip -r "../config-$KEY.zip" .)

      - uses: actions/upload-artifact@v7
        if: needs.prepare.outputs.mode == 'upload'
        with:
          name: configonly
          path: config-${{ needs.prepare.outputs.key }}.zip
          retention-days: 1

      - name: Build
        working-directory: marlin
        run: |
          set -o pipefail
          pio run -e "$PIO_ENV" 2>&1 | tee ../build.log

      - name: Package
        run: |
          shopt -s nullglob
          files=(marlin/.pio/build/"$PIO_ENV"/*.{bin,hex,srec,uf2,cbd})
          (( ${#files[@]} )) || { echo "No firmware files found"; ls -la "marlin/.pio/build/$PIO_ENV"; exit 1; }
          cp "${files[@]}" out/
          if [[ $RELEASE == true ]]; then
            NOTE="Marlin $VERSION is a release and no longer gets fixes. Before reporting
          a bug, please check whether it still happens with bugfix-2.1.x."
          else
            NOTE="bugfix-2.1.x has the latest fixes, but recent changes can introduce
          new bugs. If you find one, please report it to the Marlin project
          with the details in this file."
          fi
          if [[ $MODE == upload ]]; then
            if [[ $MIGRATED == true ]]; then
              SOURCE="Your uploaded files (original/), based on Marlin $BASE,
                         migrated to $VERSION (config/). See MIGRATION_REPORT.txt."
            else
              SOURCE="Your uploaded files, unchanged (config/)"
            fi
          else
            SOURCE="$CONFIG
          Configurations: https://github.com/$CONFIGS_REPO/tree/${{ needs.prepare.outputs.configs_sha }}/config/examples/${CONFIG// /%20}"
          fi
          cat > out/BUILD_INFO.txt <<EOF
          Marlin version: $VERSION
          Configuration: $SOURCE
          Environment:   $PIO_ENV
          Marlin:        https://github.com/$MARLIN_REPO/commit/${{ needs.prepare.outputs.marlin_sha }}
          Built:         $(date -u +'%Y-%m-%d %H:%M UTC')

          Copy the firmware file to the printer's SD card without renaming it
          (some boards only accept a specific file name). The config/ folder
          holds the configuration files this firmware was built from.

          $NOTE
          EOF
          (cd out && zip -r "../build-$KEY.zip" .)

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: firmware
          path: build-${{ needs.prepare.outputs.key }}.zip
          retention-days: 1

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: log
          path: build.log
          retention-days: 7

  publish:
    needs: [prepare, build]
    if: always() && needs.prepare.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      MODE: ${{ needs.prepare.outputs.mode }}
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE: ${{ needs.prepare.outputs.release }}
      CONFIG: ${{ needs.prepare.outputs.config }}
      PIO_ENV: ${{ needs.prepare.outputs.env }}
      ENVS: ${{ needs.prepare.outputs.envs }}
      BOARD: ${{ needs.prepare.outputs.board }}
      BASE: ${{ needs.prepare.outputs.base }}
      MIGRATED: ${{ needs.prepare.outputs.migrated }}
      KEY: ${{ needs.prepare.outputs.key }}
      CACHED: ${{ needs.prepare.outputs.cached }}
      PREBUILT: ${{ needs.prepare.outputs.prebuilt }}
      PREBUILT_URL: ${{ needs.prepare.outputs.prebuilt_url }}
      BUILD_RESULT: ${{ needs.build.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@v8
        if: needs.build.result != 'skipped' || needs.prepare.outputs.prebuilt == 'true'
        continue-on-error: true
        with:
          merge-multiple: true

      - name: Upload and reply
        run: |
          ASSET="build-$KEY.zip"
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/builds/$ASSET"
          OTHERS=$(for e in $ENVS; do [[ $e == "$PIO_ENV" ]] || printf '`%s` ' "$e"; done)
          if [[ $MODE == upload ]]; then
            WHAT="your configuration (board \`$BOARD\`)"
          else
            WHAT="configuration \`$CONFIG\`"
          fi
          ensure_release() {
            gh release view builds >/dev/null 2>&1 || \
              gh release create builds --prerelease --title "Firmware builds" \
                --notes "Firmware built on request. Files are removed after a couple of weeks."
          }

          if [[ $CACHED == true || $PREBUILT == true || $BUILD_RESULT == success ]]; then
            if [[ $CACHED != true ]]; then
              ensure_release
              gh release upload builds "$ASSET" --clobber
            fi
            {
              echo "### :white_check_mark: Firmware ready"
              echo
              echo "**[Download $ASSET]($URL)**"
              echo
              echo "Marlin \`$VERSION\`, $WHAT, environment \`$PIO_ENV\`."
              echo "The zip holds the firmware file(s), the configuration used and \`BUILD_INFO.txt\`."
              if [[ $PREBUILT == true ]]; then
                echo "This firmware was already built for Marlin \`$VERSION\` and published in [MarlinBuilds]($PREBUILT_URL), so no new build was needed. Its checksum was verified."
              fi
              if [[ $MODE == upload && $MIGRATED == true ]]; then
                echo "Your files were migrated from Marlin \`$BASE\`: \`config/\` has the migrated files (keep these for next time),"
                echo "\`original/\` has yours, and \`MIGRATION_REPORT.txt\` lists every change. Check the report before flashing."
              fi
              echo "Copy the firmware file to the SD card **without renaming it**."
              [[ -n $OTHERS ]] && echo && echo "If this doesn't boot on your board, try another environment: $OTHERS"
              echo
              if [[ $RELEASE == true ]]; then
                echo "> Marlin $VERSION is a release and no longer gets fixes. This download expires after about two weeks."
              else
                echo "> bugfix-2.1.x has the latest fixes, but recent changes can introduce new bugs. This download expires after about two weeks."
              fi
            } > reply.md
            gh issue comment "$ISSUE" --body-file reply.md
            gh issue close "$ISSUE" --reason completed
          else
            CFG_ASSET="config-$KEY.zip"
            if [[ $MODE == upload && -f $CFG_ASSET ]]; then
              ensure_release
              gh release upload builds "$CFG_ASSET" --clobber
            fi
            {
              echo "### :x: Build failed"
              echo
              if [[ $MODE == upload ]]; then
                echo "Your configuration did not compile for \`$PIO_ENV\` with Marlin \`$VERSION\`."
                echo "The errors below usually point at the option to fix. Fix it in your files and open a new request."
                if [[ $MIGRATED == true && -f $CFG_ASSET ]]; then
                  echo
                  echo "Your files were migrated from Marlin \`$BASE\`. **[Download the migrated files and report]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/builds/$CFG_ASSET)**,"
                  echo "fix those, and attach them to your next request so they don't need migrating again."
                fi
              elif [[ $RELEASE == true ]]; then
                echo "\`$CONFIG\` did not compile for \`$PIO_ENV\` with Marlin \`$VERSION\`."
                echo "Some older example configurations don't build. Try a newer release or bugfix-2.1.x."
                echo "This is usually a problem in Marlin or the example configuration, not something you did."
              else
                echo "\`$CONFIG\` did not compile for \`$PIO_ENV\` on today's bugfix-2.1.x."
                echo "This is usually a problem in Marlin or the example configuration, not something you did."
              fi
              echo
              if [[ -f build.log ]]; then
                echo '```text'
                { grep -E '(error|Error):' build.log | head -20; echo '...'; tail -n 15 build.log; } | cut -c1-300
                echo '```'
              fi
              echo
              echo "[Full build log]($RUN_URL)"
            } > reply.md
            gh issue comment "$ISSUE" --body-file reply.md
            gh label create build-failed --color B60205 --description "Firmware build failed" 2>/dev/null || true
            gh issue edit "$ISSUE" --add-label build-failed
            gh issue close "$ISSUE" --reason "not planned"
          fi
