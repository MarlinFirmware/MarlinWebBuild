#
# Rebuild the configuration index and deploy the picker page to GitHub Pages.
#
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/**', '.github/workflows/pages.yml']
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build indexes
        run: |
          python3 tools/build_site.py site --repo "$GITHUB_REPOSITORY"
          echo "$(jq '.versions | length' site/versions.json) versions indexed"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
