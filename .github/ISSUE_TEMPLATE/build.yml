name: Firmware build request
description: Build Marlin firmware from an example configuration
title: "Build: "
labels: [build-request]
body:
  - type: markdown
    attributes:
      value: |
        The easiest way to fill this in is from the [configuration picker](https://marlinfirmware.github.io/MarlinWebBuild/).
        A bot will reply here with a download link in a few minutes.
  - type: input
    id: version
    attributes:
      label: Marlin version
      description: "`bugfix-2.1.x` for the latest code, or the latest patch release of a series, such as `2.1.2.10` or `2.0.9.12`. Series from 2.0.7 on are available."
      value: bugfix-2.1.x
    validations:
      required: true
  - type: input
    id: config
    attributes:
      label: Configuration
      description: Folder under `config/examples` in MarlinFirmware/Configurations for that version, e.g. `Creality/Ender-3/CrealityV422`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Build environment
      description: PlatformIO environment. Leave blank to use the board's default.
  - type: checkboxes
    id: ack
    attributes:
      label: Acknowledgement
      options:
        - label: I understand bugfix-2.1.x is updated daily, so it has the latest fixes but may also contain recently introduced bugs, and that older releases don't get fixes.
          required: true
